name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, ort_arch: x64, ort_sha: cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57 }
          - { arch: arm64, runner: ubuntu-24.04-arm, ort_arch: aarch64, ort_sha: c5b8b3cca31f3d643a3b313b8f42e2d0f16a4fcefd02cda343d97bd5306afaab }
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    env:
      CGO_ENABLED: "1"
      # Must match the version onnxruntime_go in go.mod is built for.
      ORT_VERSION: "1.31.0"
    steps:
      - name: Compilation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates curl \
            libvips-dev libssl-dev

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ONNX Runtime Library
        run: |
          mkdir -p dist
          f=onnxruntime-linux-${{ matrix.ort_arch }}-${ORT_VERSION}.tgz
          curl -fsSL -o "$f" "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/$f"
          echo "${{ matrix.ort_sha }}  $f" | sha256sum -c -
          tar xzf "$f"
          # Fixed name: nfpm does not expand variables in contents paths.
          cp -L "onnxruntime-linux-${{ matrix.ort_arch }}-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" dist/libonnxruntime.so

      - name: Compile
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/umbela-cli ./cmd/umbela-cli

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Packaging
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dev' }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          export VERSION="${VERSION#v}"
          for fmt in deb rpm archlinux; do
            nfpm package -p $fmt -f packaging/nfpm.yaml -t dist/
          done

          # Plain download: the binary named `umbela` plus the library next to it.
          mkdir -p stage
          cp dist/umbela-cli stage/umbela-cli
          cp dist/libonnxruntime.so "stage/libonnxruntime.so.${ORT_VERSION}"
          cp LICENSE stage/
          tar -czf dist/umbela-cli-linux-${ARCH}.tar.gz -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz

  macos:
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, ort_sha: 1031b36dd3bdaa8d976a6130d9cf2a05e9be320b93ae804f8427b91dc3432afc }
          # ONNX Runtime has no macOS Intel build, so this one runs without face recognition.
          - { arch: amd64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      ORT_VERSION: "1.31.0"
    steps:
      - name: Compilation dependencies
        run: brew install vips pkgconf

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ONNX Runtime Library
        if: matrix.ort_sha != ''
        run: |
          f=onnxruntime-osx-arm64-${ORT_VERSION}.tgz
          curl -fsSL -o "$f" "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/$f"
          echo "${{ matrix.ort_sha }}  $f" | shasum -a 256 -c -
          tar xzf "$f"
          cp -L "onnxruntime-osx-arm64-${ORT_VERSION}/lib/libonnxruntime.${ORT_VERSION}.dylib" .

      - name: Compilation
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o umbela-cli ./cmd/umbela-cli
          files="umbela-cli LICENSE"
          if [ -f "libonnxruntime.${ORT_VERSION}.dylib" ]; then
            files="$files libonnxruntime.${ORT_VERSION}.dylib"
          fi
          tar -czf dist/umbela-cli-darwin-${{ matrix.arch }}.tar.gz $files

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      CC: gcc
      # Must match the version onnxruntime_go in go.mod is built for.
      ORT_VERSION: "1.31.0"
      ORT_SHA256: 3958d8a44984160692c1b4ffd0de3cb48f8c39f9d34bb31e433db06e30b82195
      # Tor Expert Bundle; the hash is the one in the signed sha256sums of that release.
      TOR_VERSION: "16.0"
      TOR_SHA256: 2ee123e9167318a3742778ff704e75f01d4780f05a14522d451fe011011077c4
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libvips
            mingw-w64-ucrt-x86_64-openssl

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compilation
        run: |
          mkdir -p dist stage
          go build -v -trimpath -ldflags "-s -w" -o stage/umbela-cli.exe ./cmd/umbela-cli

      - name: umbela.exe dll's
        run: |
          # Every non-Windows DLL it needs, directly or through another DLL.
          ldd stage/umbela-cli.exe | grep -v -i "/c/windows" | awk '/=>/ {print $3}' | sort -u > dlls.txt
          cat dlls.txt
          while read -r dll; do
            if [ ! -f "$dll" ]; then echo "missing DLL: $dll"; exit 1; fi
            cp "$dll" stage/
          done < dlls.txt

      - name: ONNX Runtime Library
        run: |
          f=onnxruntime-win-x64-${ORT_VERSION}.zip
          curl -fsSL -o "$f" "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/$f"
          echo "${ORT_SHA256}  $f" | sha256sum -c -
          unzip -q "$f"
          cp "onnxruntime-win-x64-${ORT_VERSION}/lib/onnxruntime.dll" stage/

      - name: Tor
        run: |
          f=tor-expert-bundle-windows-x86_64-${TOR_VERSION}.tar.gz
          curl -fsSL -o "$f" "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_VERSION}/$f"
          echo "${TOR_SHA256}  $f" | sha256sum -c -
          mkdir tor-bundle && tar xzf "$f" -C tor-bundle
          mkdir -p stage/tor stage/data stage/licenses
          cp tor-bundle/tor/tor.exe stage/tor/
          cp tor-bundle/data/geoip tor-bundle/data/geoip6 stage/data/
          cp tor-bundle/docs/*.txt stage/licenses/
          cp LICENSE stage/

      - name: Test
        shell: pwsh
        run: |
          # Only the Windows folders in the PATH, as on a PC without MSYS2.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & .\stage\umbela-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "umbela-cli.exe does not start without MSYS2" }
          & .\stage\tor\tor.exe --version
          if ($LASTEXITCODE -ne 0) { throw "tor.exe does not start" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath dist\umbela-cli-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/*.zip

  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/*.zip
