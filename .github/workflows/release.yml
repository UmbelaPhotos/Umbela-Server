name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, ort_url: https://files.pythonhosted.org/packages/6c/44/1e9e762b95b7da0a8424913a1ed7c38cdaf88624a3c41ddba24ebac88bc9/onnxruntime-1.31.0-cp312-cp312-manylinux_2_28_x86_64.whl, ort_sha: 5e129d6c56abd53e659cb70f00a108d6824086470ff99c2e47a82e5786563db3 }
          - { arch: arm64, runner: ubuntu-24.04-arm, ort_url: https://files.pythonhosted.org/packages/53/1a/561b43ca1536d9e81d1785bb8a1a260a9e314ef6d04976ba0411c652bda1/onnxruntime-1.31.0-cp312-cp312-manylinux_2_28_aarch64.whl, ort_sha: 35758d7606d578ec5b9d65f6e8a1f488013194c3f6097038a3223cb26d35ef9a }
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    env:
      CGO_ENABLED: "1"
      # Must match the version onnxruntime_go in go.mod is built for.
      ORT_VERSION: "1.31.0"
    steps:
      - name: Compilation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates curl unzip \
            libvips-dev libssl-dev

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ONNX Runtime Library
        run: |
          mkdir -p dist
          # microsoft/onnxruntime was removed from GitHub; the official wheels on PyPI
          # carry the same shared library. Pinned by SHA-256.
          f=ort.whl
          curl -fsSL -o "$f" "${{ matrix.ort_url }}"
          echo "${{ matrix.ort_sha }}  $f" | sha256sum -c -
          unzip -q -o "$f" 'onnxruntime/capi/libonnxruntime.so.*'
          # Fixed name: nfpm does not expand variables in contents paths.
          cp -L "onnxruntime/capi/libonnxruntime.so.${ORT_VERSION}" dist/libonnxruntime.so

      - name: Compile
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/umbela-cli ./cmd/umbela-cli

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Packaging
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dev' }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          export VERSION="${VERSION#v}"
          for fmt in deb rpm archlinux; do
            nfpm package -p $fmt -f packaging/nfpm.yaml -t dist/
          done

          # Plain download: the binary named `umbela` plus the library next to it.
          mkdir -p stage
          cp dist/umbela-cli stage/umbela-cli
          cp dist/libonnxruntime.so "stage/libonnxruntime.so.${ORT_VERSION}"
          cp LICENSE stage/
          tar -czf dist/umbela-cli-linux-${ARCH}.tar.gz -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz

  macos:
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, ort_url: https://files.pythonhosted.org/packages/b3/bd/2ac094311163b803e3626c3937461d6900934bd56cca7601f6150ff860c3/onnxruntime-1.31.0-cp312-cp312-macosx_14_0_arm64.whl, ort_sha: aaab9b3af536b06ca27ab5e35e3d429c97457ce76cf298af103f687e8b9975c0 }
          # ONNX Runtime has no macOS Intel build, so this one runs without face recognition.
          - { arch: amd64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      ORT_VERSION: "1.31.0"
    steps:
      - name: Compilation dependencies
        run: brew install vips pkgconf

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ONNX Runtime Library
        if: matrix.ort_sha != ''
        run: |
          f=ort.whl
          curl -fsSL -o "$f" "${{ matrix.ort_url }}"
          echo "${{ matrix.ort_sha }}  $f" | shasum -a 256 -c -
          unzip -q -o "$f" 'onnxruntime/capi/libonnxruntime.*.dylib'
          cp -L "onnxruntime/capi/libonnxruntime.${ORT_VERSION}.dylib" .

      - name: Compilation
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o umbela-cli ./cmd/umbela-cli
          files="umbela-cli LICENSE"
          if [ -f "libonnxruntime.${ORT_VERSION}.dylib" ]; then
            files="$files libonnxruntime.${ORT_VERSION}.dylib"
          fi
          tar -czf dist/umbela-cli-darwin-${{ matrix.arch }}.tar.gz $files

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      CC: gcc
      # Must match the version onnxruntime_go in go.mod is built for.
      ORT_VERSION: "1.31.0"
      ORT_URL: https://files.pythonhosted.org/packages/be/ed/b12cea136ccd7b03d924f46b8393faf7ceac21115c0c50e729faa248cf23/onnxruntime-1.31.0-cp312-cp312-win_amd64.whl
      ORT_SHA256: 09d56445c1753e66e0912de69d3f0184016ad9a191dcd6925bf5dd570d2bfbe5
      # Tor Expert Bundle; the hash is the one in the signed sha256sums of that release.
      TOR_VERSION: "16.0"
      TOR_SHA256: 2ee123e9167318a3742778ff704e75f01d4780f05a14522d451fe011011077c4
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libvips
            mingw-w64-ucrt-x86_64-openssl

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compilation
        run: |
          mkdir -p dist stage
          go build -v -trimpath -ldflags "-s -w" -o stage/umbela-cli.exe ./cmd/umbela-cli

      - name: umbela.exe dll's
        run: |
          # Every non-Windows DLL it needs, directly or through another DLL.
          ldd stage/umbela-cli.exe | grep -v -i "/c/windows" | awk '/=>/ {print $3}' | sort -u > dlls.txt
          cat dlls.txt
          while read -r dll; do
            if [ ! -f "$dll" ]; then echo "missing DLL: $dll"; exit 1; fi
            cp "$dll" stage/
          done < dlls.txt

      - name: ONNX Runtime Library
        run: |
          f=ort.whl
          curl -fsSL -o "$f" "${ORT_URL}"
          echo "${ORT_SHA256}  $f" | sha256sum -c -
          unzip -q -o "$f" 'onnxruntime/capi/onnxruntime.dll'
          cp "onnxruntime/capi/onnxruntime.dll" stage/

      - name: VC++ runtime (for ONNX Runtime)
        shell: pwsh
        run: |
          # ONNX Runtime is built with MSVC and crashes in CreateEnv with the old
          # msvcp140.dll some Windows installs have, so it ships its own next to it.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          # The runner has several runtimes (VS 2019's 14.29 and VS 2022's 14.4x):
          # take the newest one, by the version of its msvcp140.dll.
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" |
            Where-Object { Test-Path "$($_.FullName)\msvcp140.dll" } |
            Sort-Object { (Get-Item "$($_.FullName)\msvcp140.dll").VersionInfo.FileVersionRaw } -Descending |
            Select-Object -First 1
          if (-not $crt) { throw "VC++ runtime not found in $vs" }
          $ver = (Get-Item "$($crt.FullName)\msvcp140.dll").VersionInfo.FileVersionRaw
          Write-Host "Using $($crt.FullName) ($ver)"
          if ($ver -lt [version]"14.40") { throw "VC++ runtime $ver is too old for ONNX Runtime" }
          Copy-Item "$($crt.FullName)\*.dll" stage\
          foreach ($f in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            if (-not (Test-Path "stage\$f")) { throw "$f missing from the zip" }
          }

      - name: Tor
        run: |
          f=tor-expert-bundle-windows-x86_64-${TOR_VERSION}.tar.gz
          curl -fsSL -o "$f" "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_VERSION}/$f"
          echo "${TOR_SHA256}  $f" | sha256sum -c -
          mkdir tor-bundle && tar xzf "$f" -C tor-bundle
          mkdir -p stage/tor stage/data stage/licenses
          cp tor-bundle/tor/tor.exe stage/tor/
          cp tor-bundle/data/geoip tor-bundle/data/geoip6 stage/data/
          cp tor-bundle/docs/*.txt stage/licenses/
          cp LICENSE stage/

      - name: Test
        shell: pwsh
        run: |
          # Only the Windows folders in the PATH, as on a PC without MSYS2.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & .\stage\umbela-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "umbela-cli.exe does not start without MSYS2" }
          & .\stage\tor\tor.exe --version
          if ($LASTEXITCODE -ne 0) { throw "tor.exe does not start" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath dist\umbela-cli-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/*.zip

  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/*.zip
